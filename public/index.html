<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIDDI — Sistema de Gestión Documental</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Animated grid background */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(37, 99, 235, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(37, 99, 235, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
    }

    .bg-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.12;
      z-index: 0;
    }
    .bg-glow-1 { background: #2563EB; top: -200px; right: -100px; }
    .bg-glow-2 { background: #00C853; bottom: -200px; left: -100px; }

    .landing-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 900px;
      padding: 40px 24px;
      text-align: center;
    }

    .logo-area {
      margin-bottom: 48px;
      animation: fadeIn 0.6s ease;
    }

    .logo-text {
      font-family: var(--font-mono);
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -4px;
      color: var(--text-primary);
      line-height: 1;
      position: relative;
      display: inline-block;
    }

    .logo-text::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .logo-sub {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 20px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-weight: 500;
    }

    .company-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 40px;
    }

    .company-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 24px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: fadeIn 0.6s ease both;
    }

    .company-card:nth-child(1) { animation-delay: 0.1s; }
    .company-card:nth-child(2) { animation-delay: 0.2s; }
    .company-card:nth-child(3) { animation-delay: 0.3s; }

    .company-card::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.25s;
    }

    .company-card.x1::before { background: radial-gradient(ellipse at top, rgba(0,200,83,0.08) 0%, transparent 70%); }
    .company-card.x2::before { background: radial-gradient(ellipse at top, rgba(0,188,212,0.08) 0%, transparent 70%); }
    .company-card.x3::before { background: radial-gradient(ellipse at top, rgba(255,111,0,0.08) 0%, transparent 70%); }

    .company-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .company-card:hover::before { opacity: 1; }

    .company-card.x1:hover { border-color: var(--x1); }
    .company-card.x2:hover { border-color: var(--x2); }
    .company-card.x3:hover { border-color: var(--x3); }

    .company-orb {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
      position: relative;
      z-index: 1;
    }

    .company-orb.x1 { background: rgba(0,200,83,0.12); color: var(--x1); border: 2px solid rgba(0,200,83,0.3); }
    .company-orb.x2 { background: rgba(0,188,212,0.12); color: var(--x2); border: 2px solid rgba(0,188,212,0.3); }
    .company-orb.x3 { background: rgba(255,111,0,0.12); color: var(--x3); border: 2px solid rgba(255,111,0,0.3); }

    .company-name {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 700;
      position: relative;
      z-index: 1;
    }

    .company-desc {
      font-size: 13px;
      color: var(--text-secondary);
      position: relative;
      z-index: 1;
    }

    .company-arrow {
      font-size: 20px;
      opacity: 0;
      transform: translateX(-8px);
      transition: all 0.2s;
      position: relative;
      z-index: 1;
    }
    .company-card:hover .company-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .footer-note {
      margin-top: 48px;
      font-size: 12px;
      color: var(--text-muted);
      animation: fadeIn 0.8s ease 0.5s both;
    }

    @media (max-width: 640px) {
      .company-grid { grid-template-columns: 1fr; }
      .logo-text { font-size: 48px; }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="landing-wrapper">
    <div class="logo-area">
      <div class="logo-text">MIDDI</div>
      <p class="logo-sub">Sistema de Gestión Documental de Trabajadores</p>
    </div>

    <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 8px;">
      Seleccione su empresa para continuar
    </p>

    <div class="company-grid">
      <a href="/login/x1" class="company-card x1">
        <div class="company-orb x1">X1</div>
        <div class="company-name">MIDDI X1</div>
        <div class="company-desc">Acceso empresa X1</div>
        <div class="company-arrow">→</div>
      </a>

      <a href="/login/x2" class="company-card x2">
        <div class="company-orb x2">X2</div>
        <div class="company-name">MIDDI X2</div>
        <div class="company-desc">Acceso empresa X2</div>
        <div class="company-arrow">→</div>
      </a>

      <a href="/login/x3" class="company-card x3">
        <div class="company-orb x3">X3</div>
        <div class="company-name">MIDDI X3</div>
        <div class="company-desc">Acceso empresa X3</div>
        <div class="company-arrow">→</div>
      </a>
    </div>

    <p class="footer-note">
      Sistema de acceso restringido. Solo personal autorizado.
    </p>
  </div>

  <script>
    // Check if already logged in
    fetch('/api/auth/session').then(r => r.json()).then(data => {
      if (data.loggedIn) window.location.href = '/dashboard';
    });
  </script>
</body>
</html>
