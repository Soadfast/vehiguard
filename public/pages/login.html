<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIDDI — Iniciar Sesión</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0f1e;
      font-family: 'Inter', system-ui, sans-serif;
    }

    .bg-grid {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(37,99,235,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(37,99,235,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .bg-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      opacity: 0;
      transition: background 1s, opacity 0.8s;
    }
    .bg-glow-1 { width: 500px; height: 500px; top: -150px; right: -100px; opacity: 0.08; }
    .bg-glow-2 { width: 400px; height: 400px; bottom: -150px; left: -100px; opacity: 0.06; }

    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Logo */
    .logo-area {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px; height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      font-family: monospace;
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -1px;
      margin-bottom: 14px;
      box-shadow: 0 8px 32px rgba(37,99,235,0.3);
    }
    .logo-name {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #f1f5f9;
    }
    .logo-sub {
      font-size: 12px;
      color: #64748b;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* Card */
    .card {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }

    .card-body { padding: 32px; }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 6px;
    }
    .card-sub {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 28px;
    }

    /* Fields */
    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    .input-wrap { position: relative; }
    .input-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: #475569;
      font-size: 15px;
      pointer-events: none;
    }
    .field input {
      width: 100%;
      padding: 13px 14px 13px 44px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      color: #f1f5f9;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field input::placeholder { color: #334155; }
    .field input:focus {
      border-color: var(--accent-color, #2563eb);
      box-shadow: 0 0 0 3px var(--accent-glow, rgba(37,99,235,0.15));
    }
    .field input.error-input { border-color: #ef4444 !important; }

    /* Error */
    .error-box {
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 18px;
      font-size: 13px;
      color: #fca5a5;
    }
    .error-box.show { display: flex; }

    /* Button */
    .btn-login {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      background: var(--accent-color, #2563eb);
      color: #fff;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
      box-shadow: 0 4px 16px var(--accent-glow, rgba(37,99,235,0.3));
    }
    .btn-login:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px var(--accent-glow, rgba(37,99,235,0.4));
    }
    .btn-login:active:not(:disabled) { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Company indicator */
    .company-badge {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 18px;
      border: 1px solid;
    }
    .company-badge.show { display: flex; }
    .badge-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #334155;
      border-top: 1px solid #1e293b;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-1" id="glow1"></div>
  <div class="bg-glow bg-glow-2" id="glow2"></div>

  <div class="login-wrap">
    <div class="logo-area">
      <div class="logo-mark">M</div>
      <div class="logo-name">MIDDI</div>
      <div class="logo-sub">Sistema de Gestión Documental</div>
    </div>

    <div class="card">
      <div class="card-body">
        <h1 class="card-title">Bienvenido</h1>
        <p class="card-sub">Ingrese sus credenciales para acceder al sistema</p>

        <!-- Company badge appears after username detection -->
        <div class="company-badge" id="companyBadge">
          <div class="badge-dot"></div>
          <span id="badgeName"></span>
        </div>

        <!-- Error message -->
        <div class="error-box" id="errorBox">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span id="errorText">Usuario o contraseña incorrectos.</span>
        </div>

        <div class="field">
          <label for="username">Usuario</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" id="username" placeholder="Ingrese su usuario"
              autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="100">
          </div>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="password" placeholder="Ingrese su contraseña"
              autocomplete="current-password" maxlength="200">
          </div>
        </div>

        <button class="btn-login" id="btnLogin">
          <span id="btnText">Iniciar Sesión</span>
          <div class="spinner" id="btnSpinner" style="display:none"></div>
        </button>
      </div>

      <div class="footer">MIDDI © 2024 — Acceso restringido</div>
    </div>
  </div>

  <script>
    // Company theme data (no passwords, no empresa IDs)
    const THEMES = {
      'muñeco':  { name: 'MIDDI X MUÑECO',  color: '#00c853', glow: 'rgba(0,200,83,0.2)' },
      'belona':  { name: 'MIDDI X BELONA',  color: '#00bcd4', glow: 'rgba(0,188,212,0.2)' },
      'bambono': { name: 'MIDDI X BAMBONO', color: '#ff6f00', glow: 'rgba(255,111,0,0.2)' }
    };

    const usernameEl = document.getElementById('username');
    const passwordEl = document.getElementById('password');
    const btnLogin   = document.getElementById('btnLogin');
    const btnText    = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const errorBox   = document.getElementById('errorBox');
    const errorText  = document.getElementById('errorText');
    const badge      = document.getElementById('companyBadge');
    const badgeName  = document.getElementById('badgeName');
    const glow1      = document.getElementById('glow1');
    const glow2      = document.getElementById('glow2');

    // Detect company from username as user types
    usernameEl.addEventListener('input', () => {
      const val = usernameEl.value.trim().toLowerCase();
      const theme = THEMES[val];
      if (theme) {
        applyTheme(theme);
        badge.classList.add('show');
        badge.style.color = theme.color;
        badge.style.borderColor = theme.color + '44';
        badge.style.background = theme.color + '12';
        badgeName.textContent = theme.name;
      } else {
        badge.classList.remove('show');
        resetTheme();
      }
      hideError();
    });

    passwordEl.addEventListener('input', hideError);

    function applyTheme(theme) {
      document.documentElement.style.setProperty('--accent-color', theme.color);
      document.documentElement.style.setProperty('--accent-glow', theme.glow);
      glow1.style.background = theme.color;
      glow2.style.background = theme.color;
    }

    function resetTheme() {
      document.documentElement.style.setProperty('--accent-color', '#2563eb');
      document.documentElement.style.setProperty('--accent-glow', 'rgba(37,99,235,0.2)');
      glow1.style.background = '#2563eb';
      glow2.style.background = '#2563eb';
    }

    function showError(msg) {
      errorText.textContent = msg;
      errorBox.classList.add('show');
      usernameEl.classList.add('error-input');
      passwordEl.classList.add('error-input');
    }

    function hideError() {
      errorBox.classList.remove('show');
      usernameEl.classList.remove('error-input');
      passwordEl.classList.remove('error-input');
    }

    function setLoading(on) {
      btnText.style.display = on ? 'none' : 'inline';
      btnSpinner.style.display = on ? 'block' : 'none';
      btnLogin.disabled = on;
    }

    // Submit
    btnLogin.addEventListener('click', handleLogin);
    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });

    async function handleLogin() {
      const username = usernameEl.value.trim();
      const password = passwordEl.value;

      if (!username) { usernameEl.focus(); showError('El usuario es obligatorio.'); return; }
      if (!password) { passwordEl.focus(); showError('La contraseña es obligatoria.'); return; }

      hideError();
      setLoading(true);

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          btnText.style.display = 'inline';
          btnLogin.textContent = '✓ Acceso concedido';
          btnLogin.style.background = '#00c853';
          setTimeout(() => { window.location.href = data.redirect || '/dashboard'; }, 600);
        } else {
          setLoading(false);
          showError(data.error || 'Usuario o contraseña incorrectos.');
          passwordEl.value = '';
          passwordEl.focus();
        }
      } catch {
        setLoading(false);
        showError('Error de conexión. Intente nuevamente.');
      }
    }

    // If already logged in, redirect
    fetch('/api/auth/session', { credentials: 'same-origin' })
      .then(r => r.json())
      .then(d => { if (d.loggedIn) window.location.href = '/dashboard'; })
      .catch(() => {});

    resetTheme();
  </script>
</body>
</html>
