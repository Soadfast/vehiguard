<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIDDI — Detalle Trabajador</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .worker-profile {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
      padding: 24px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }
    .profile-avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: var(--bg-hover);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono);
      font-size: 24px; font-weight: 700;
      color: var(--text-secondary);
      flex-shrink: 0;
      border: 2px solid var(--border);
    }
    .profile-info { flex: 1; }
    .profile-name { font-size: 22px; font-weight: 700; }
    .profile-rut { font-size: 14px; color: var(--text-secondary); font-family: var(--font-mono); margin-top: 2px; }
    .profile-meta {
      display: flex; gap: 20px; margin-top: 12px; flex-wrap: wrap;
    }
    .profile-meta-item { font-size: 13px; color: var(--text-secondary); }
    .profile-meta-item strong { color: var(--text-primary); font-weight: 500; }
    .profile-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .grid-2 { grid-template-columns: 1fr; }
      .worker-profile { flex-direction: column; text-align: center; }
      .profile-meta { justify-content: center; }
      .profile-actions { justify-content: center; }
    }

    .days-tag {
      font-size: 11px;
      font-family: var(--font-mono);
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--bg-hover);
      color: var(--text-muted);
    }
    .days-tag.warning { color: var(--amber); background: var(--amber-dim); }
    .days-tag.expired { color: var(--red); background: var(--red-dim); }
    .days-tag.ok { color: var(--green); background: var(--green-dim); }

    .file-type-icon { font-size: 22px; }

    .upload-file-name {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="/dashboard" class="navbar-brand">
      <span class="brand-dot"></span>
      <span>MIDDI</span>
    </a>
    <div class="navbar-right">
      <span class="company-pill" id="companyPill" style="color:#888;border-color:#333">—</span>
      <a href="/dashboard" class="btn btn-ghost btn-sm">← Dashboard</a>
      <button class="btn btn-ghost btn-sm" onclick="logout()">Salir</button>
    </div>
  </nav>

  <div class="page-container fade-in" id="mainContent">
    <div class="loading-overlay">
      <div class="spinner"></div>
      <span>Cargando información...</span>
    </div>
  </div>

  <!-- Modal: Upload Document -->
  <div class="modal-overlay" id="modalUpload">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Subir Documento</span>
        <button class="modal-close" onclick="Modal.close('modalUpload')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Tipo de Documento *</label>
          <select class="form-select" id="docTipo">
            <option value="">Seleccione tipo...</option>
            <option value="cedula_identidad">Cédula de Identidad</option>
            <option value="antecedentes">Antecedentes</option>
            <option value="contrato">Contrato</option>
            <option value="licencia_conducir">Licencia de Conducir</option>
            <option value="examen_medico">Examen Médico</option>
            <option value="capacitacion">Capacitación</option>
            <option value="seguro">Seguro</option>
            <option value="otro">Otro</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Fecha de Vencimiento *</label>
          <input type="date" class="form-input" id="docFechaVenc">
        </div>
        <div class="form-group">
          <label class="form-label">Observaciones</label>
          <textarea class="form-textarea" id="docObservaciones" placeholder="Notas adicionales..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Archivo (PDF o Imagen) *</label>
          <div class="upload-zone" id="uploadZone" onclick="document.getElementById('docFile').click()">
            <div class="upload-zone-icon">📎</div>
            <div class="upload-zone-text">Haga clic para seleccionar archivo</div>
            <div class="upload-zone-hint">PDF, JPG, PNG, WEBP — máx. 10MB</div>
          </div>
          <input type="file" id="docFile" style="display:none"
            accept=".pdf,.jpg,.jpeg,.png,.webp"
            onchange="handleFileSelect(this)">
          <div class="upload-file-name" id="selectedFileName"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Modal.close('modalUpload')">Cancelar</button>
        <button class="btn btn-primary" id="btnUpload" onclick="uploadDocument()">Subir Documento</button>
      </div>
    </div>
  </div>

  <!-- Modal: Edit Worker -->
  <div class="modal-overlay" id="modalEditWorker">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Editar Trabajador</span>
        <button class="modal-close" onclick="Modal.close('modalEditWorker')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Nombre Completo</label>
          <input type="text" class="form-input" id="editNombre">
        </div>
        <div class="form-group">
          <label class="form-label">RUT</label>
          <input type="text" class="form-input" id="editRut">
        </div>
        <div class="form-group">
          <label class="form-label">Cargo</label>
          <input type="text" class="form-input" id="editCargo">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="Modal.close('modalEditWorker')">Cancelar</button>
        <button class="btn btn-primary" onclick="saveEditWorker()">Guardar</button>
      </div>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script>
    const workerId = window.location.pathname.split('/').pop();
    let workerData = null;
    let session = null;

    const COMPANY_COLORS = { x1: '#00C853', x2: '#00BCD4', x3: '#FF6F00' };

    async function init() {
      session = await checkSession();
      if (!session) return;

      const color = COMPANY_COLORS[session.empresa] || '#2563EB';
      const pill = document.getElementById('companyPill');
      pill.textContent = session.companyName;
      pill.style.color = color;
      pill.style.borderColor = color + '55';
      pill.style.background = color + '15';

      await loadWorker();
    }

    async function loadWorker() {
      const data = await api.get(`/api/workers/${workerId}`);
      if (!data || !data.success) {
        document.getElementById('mainContent').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <div class="empty-state-title">Trabajador no encontrado</div>
            <a href="/dashboard" class="btn btn-primary" style="margin-top:16px">← Volver al dashboard</a>
          </div>`;
        return;
      }

      workerData = data.data;
      renderPage();
    }

    function getDaysTag(date) {
      const days = DateHelper.daysRemaining(date);
      if (days < 0) return `<span class="days-tag expired">${Math.abs(days)}d vencido</span>`;
      if (days <= 30) return `<span class="days-tag warning">Vence en ${days}d</span>`;
      return `<span class="days-tag ok">${days}d restantes</span>`;
    }

    function renderPage() {
      const { worker, documents } = workerData;
      const initials = worker.nombre.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
      const hoy = new Date(); hoy.setHours(0,0,0,0);
      const vencidos = documents.filter(d => new Date(d.fechaVencimiento) < hoy);
      const vigentes = documents.filter(d => new Date(d.fechaVencimiento) >= hoy);

      const estadoBadge = vencidos.length > 0
        ? `<span class="badge badge-vencido badge-dot">${vencidos.length} vencido${vencidos.length > 1 ? 's' : ''}</span>`
        : `<span class="badge badge-vigente badge-dot">Al día</span>`;

      const docsHtml = documents.length === 0
        ? `<div class="empty-state" style="padding:40px 20px">
            <div class="empty-state-icon">📂</div>
            <div class="empty-state-title">Sin documentos</div>
            <div class="empty-state-text">Suba el primer documento para este trabajador</div>
           </div>`
        : documents.map(doc => {
            const expired = DateHelper.isExpired(doc.fechaVencimiento);
            const icon = DOC_ICONS[doc.tipo] || '📄';
            return `<div class="doc-item ${expired ? 'vencido' : 'vigente'}">
              <div class="doc-icon">${icon}</div>
              <div class="doc-info">
                <div class="doc-name">${TIPO_LABELS[doc.tipo] || doc.tipo}</div>
                <div class="doc-meta">
                  ${doc.nombreArchivo} &nbsp;·&nbsp;
                  Vence: ${DateHelper.format(doc.fechaVencimiento)} &nbsp;
                  ${getDaysTag(doc.fechaVencimiento)}
                </div>
                ${doc.observaciones ? `<div class="doc-meta" style="margin-top:4px; font-style:italic">${doc.observaciones}</div>` : ''}
              </div>
              <div class="doc-actions">
                ${DateHelper.badge(doc.fechaVencimiento)}
                <a href="/api/documents/file/${doc._id}" target="_blank" class="btn btn-ghost btn-sm">Ver</a>
                <button class="btn btn-danger btn-sm" onclick="deleteDoc('${doc._id}')">✕</button>
              </div>
            </div>`;
          }).join('');

      document.title = `MIDDI — ${worker.nombre}`;

      document.getElementById('mainContent').innerHTML = `
        <div class="page-header">
          <div>
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
              <a href="/dashboard" style="color:var(--text-secondary);text-decoration:none;font-size:13px">← Dashboard</a>
              <span style="color:var(--border)">›</span>
              <span style="font-size:13px;color:var(--text-secondary)">${worker.nombre}</span>
            </div>
            <h1 class="page-title">Detalle del Trabajador</h1>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-ghost" onclick="openEditModal()">✏️ Editar</button>
            <button class="btn btn-success" onclick="Modal.open('modalUpload')">+ Subir Documento</button>
            <button class="btn btn-ghost" onclick="exportWorkerExcel('${worker._id}')">📊 Excel</button>
            <button class="btn btn-ghost" onclick="exportWorkerPDF('${worker._id}')">📄 PDF</button>
            <button class="btn btn-ghost" onclick="showQR('${worker._id}')">📷 Ver QR</button>
          </div>
        </div>

        <!-- Worker profile card -->
        <div class="worker-profile">
          <div class="profile-avatar">${initials}</div>
          <div class="profile-info">
            <div class="profile-name">${worker.nombre} ${estadoBadge}</div>
            <div class="profile-rut">${worker.rut}</div>
            <div class="profile-meta">
              <div class="profile-meta-item">Cargo: <strong>${worker.cargo}</strong></div>
              <div class="profile-meta-item">Empresa: <strong>${session.companyName}</strong></div>
              <div class="profile-meta-item">Registrado: <strong>${DateHelper.format(worker.createdAt)}</strong></div>
            </div>
          </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid" style="margin-bottom:28px">
          <div class="stat-card">
            <div class="stat-label">Total Docs</div>
            <div class="stat-value blue">${documents.length}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Vigentes</div>
            <div class="stat-value green">${vigentes.length}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Vencidos</div>
            <div class="stat-value red">${vencidos.length}</div>
          </div>
        </div>

        <!-- Documents -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">Documentos</span>
            <button class="btn btn-primary btn-sm" onclick="Modal.open('modalUpload')">+ Subir</button>
          </div>
          <div class="card-body" style="padding:16px">
            ${docsHtml}
          </div>
        </div>
      `;
    }

    function openEditModal() {
      const { worker } = workerData;
      document.getElementById('editNombre').value = worker.nombre;
      document.getElementById('editRut').value = worker.rut;
      document.getElementById('editCargo').value = worker.cargo;
      Modal.open('modalEditWorker');
    }

    async function saveEditWorker() {
      const nombre = document.getElementById('editNombre').value.trim();
      const rut = document.getElementById('editRut').value.trim();
      const cargo = document.getElementById('editCargo').value.trim();

      const data = await api.put(`/api/workers/${workerId}`, { nombre, rut, cargo });
      if (data.success) {
        Modal.close('modalEditWorker');
        Toast.success('Trabajador actualizado');
        await loadWorker();
      } else {
        Toast.error(data.error || 'Error al actualizar');
      }
    }

    function handleFileSelect(input) {
      const file = input.files[0];
      const nameEl = document.getElementById('selectedFileName');
      const zone = document.getElementById('uploadZone');
      if (file) {
        nameEl.textContent = `✅ ${file.name} (${(file.size / 1024).toFixed(0)} KB)`;
        zone.style.borderColor = 'var(--green)';
        zone.style.background = 'var(--green-dim)';
      } else {
        nameEl.textContent = '';
        zone.style.borderColor = '';
        zone.style.background = '';
      }
    }

    // Drag & drop
    const zone = document.getElementById('uploadZone');
    if (zone) {
      zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('dragover'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
      zone.addEventListener('drop', (e) => {
        e.preventDefault(); zone.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file) {
          document.getElementById('docFile').files = e.dataTransfer.files;
          handleFileSelect(document.getElementById('docFile'));
        }
      });
    }

    async function uploadDocument() {
      const tipo = document.getElementById('docTipo').value;
      const fechaVenc = document.getElementById('docFechaVenc').value;
      const observaciones = document.getElementById('docObservaciones').value;
      const file = document.getElementById('docFile').files[0];

      if (!tipo || !fechaVenc || !file) {
        Toast.error('Complete tipo, fecha de vencimiento y archivo');
        return;
      }

      const btn = document.getElementById('btnUpload');
      btn.disabled = true;
      btn.textContent = 'Subiendo...';

      const formData = new FormData();
      formData.append('workerId', workerId);
      formData.append('tipo', tipo);
      formData.append('fechaVencimiento', fechaVenc);
      formData.append('observaciones', observaciones);
      formData.append('archivo', file);

      const data = await api.postForm('/api/documents/upload', formData);

      btn.disabled = false;
      btn.textContent = 'Subir Documento';

      if (data.success) {
        Modal.close('modalUpload');
        // Reset form
        document.getElementById('docTipo').value = '';
        document.getElementById('docFechaVenc').value = '';
        document.getElementById('docObservaciones').value = '';
        document.getElementById('docFile').value = '';
        document.getElementById('selectedFileName').textContent = '';
        const z = document.getElementById('uploadZone');
        if (z) { z.style.borderColor = ''; z.style.background = ''; }

        Toast.success('Documento subido correctamente');
        await loadWorker();
      } else {
        Toast.error(data.error || 'Error al subir documento');
      }
    }

    async function deleteDoc(docId) {
      if (!confirm('¿Eliminar este documento?')) return;
      const data = await api.delete(`/api/documents/${docId}`);
      if (data.success) {
        Toast.success('Documento eliminado');
        await loadWorker();
      } else {
        Toast.error(data.error || 'Error al eliminar');
      }
    }

    // ── QR Modal ─────────────────────────────────────────────────────────────
    async function showQR(workerId) {
      // Create modal if not exists
      if (!document.getElementById('modalQR')) {
        const m = document.createElement('div');
        m.id = 'modalQR';
        m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;';
        m.innerHTML = `
          <div style="background:#111827;border:1px solid #1e293b;border-radius:20px;padding:32px;text-align:center;max-width:360px;width:100%;position:relative;">
            <button onclick="document.getElementById('modalQR').style.display='none'"
              style="position:absolute;top:12px;right:16px;background:none;border:none;color:#64748b;font-size:20px;cursor:pointer;">×</button>
            <div style="font-size:14px;font-weight:700;color:#f1f5f9;margin-bottom:20px;">📷 Código QR del Trabajador</div>
            <div id="qrContent" style="margin-bottom:16px;"><div style="color:#64748b;font-size:13px;">Generando QR...</div></div>
            <div id="qrWorkerName" style="font-size:13px;color:#64748b;margin-bottom:16px;"></div>
            <a id="qrDownload" download="qr-trabajador.png"
              style="display:none;padding:10px 20px;background:#2563eb;color:#fff;border-radius:10px;text-decoration:none;font-size:13px;font-weight:700;">
              ⬇ Descargar QR
            </a>
          </div>`;
        document.body.appendChild(m);
        m.addEventListener('click', (e) => { if (e.target === m) m.style.display = 'none'; });
      }
      document.getElementById('modalQR').style.display = 'flex';
      document.getElementById('qrContent').innerHTML = '<div style="color:#64748b;font-size:13px;">Generando QR...</div>';
      document.getElementById('qrWorkerName').textContent = '';
      document.getElementById('qrDownload').style.display = 'none';

      try {
        const data = await api.get(`/api/qr/worker/${workerId}`);
        if (data.success) {
          document.getElementById('qrContent').innerHTML = `<img src="${data.data.qrDataUrl}" style="width:220px;height:220px;border-radius:12px;">`;
          document.getElementById('qrWorkerName').textContent = data.data.workerName;
          const dl = document.getElementById('qrDownload');
          dl.href = data.data.qrDataUrl;
          dl.download = `qr-${data.data.workerName.replace(/\s+/g, '-').toLowerCase()}.png`;
          dl.style.display = 'inline-block';
        } else {
          document.getElementById('qrContent').innerHTML = '<div style="color:#f87171;font-size:13px;">Error al generar QR</div>';
        }
      } catch {
        document.getElementById('qrContent').innerHTML = '<div style="color:#f87171;font-size:13px;">Error de conexión</div>';
      }
    }

    init();
  </script>
</body>
</html>
